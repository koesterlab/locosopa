name: test

on:
  pull_request:
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          config: .tests/config.yaml
          deploy: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
